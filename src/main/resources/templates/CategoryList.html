<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ一覧</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>カテゴリ一覧</h1>

<a th:href="@{/categories/new}">カテゴリを新規登録</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>カテゴリ名</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <!-- ここに編集・削除ボタンを作成する -->
            <td>
                <a th:href="@{/categories/{id}/edit(id=${category.id})}">編集</a>
                <a th:href="@{/categories/{id}/delete(id=${category.id})}" onclick="return confirm('本当に削除しますか？')">削除</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
