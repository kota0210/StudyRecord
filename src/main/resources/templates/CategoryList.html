<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ一覧</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>カテゴリ一覧</h1>

<p th:if="${successMessage}" th:text="${successMessage}" style="color: green;"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<a th:href="@{/categories/new}">カテゴリを新規登録</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>カテゴリ名</th>
            <th>操作</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td>
                <a th:href="@{/categories/edit/{id}(id=${category.id})}">編集</a>

                <form th:action="@{/categories/delete/{id}(id=${category.id})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('本当に削除しますか？');">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit">削除</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<a th:href="@{/home}">ホームへ移動</a>

</body>
</html>
