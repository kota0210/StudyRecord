<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習記録編集画面</title>
</head>
<body>
    <h1>学習記録編集画面</h1>

    <a th:href="@{/study-records}">一覧に戻る</a>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

    <form th:action="@{/study-records/edit/{id}(id=${studyRecordId})}"
          th:object="${studyRecordForm}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div>
            <label for="title">タイトル:</label>
            <input type="text" id="title" th:field="*{title}">
            <p th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"
               style="color: red;"></p>
        </div>

        <div>
            <label for="content">学習内容:</label>
            <textarea id="content" th:field="*{content}"></textarea>
            <p th:if="${#fields.hasErrors('content')}"
               th:errors="*{content}"
               style="color: red;"></p>
        </div>

        <div>
            <label for="studyDate">学習日:</label>
            <input type="date" id="studyDate" th:field="*{studyDate}">
            <p th:if="${#fields.hasErrors('studyDate')}"
               th:errors="*{studyDate}"
               style="color: red;"></p>
        </div>

        <div>
            <label for="durationMinutes">学習時間（分）:</label>
            <input type="number" id="durationMinutes" th:field="*{durationMinutes}">
            <p th:if="${#fields.hasErrors('durationMinutes')}"
               th:errors="*{durationMinutes}"
               style="color: red;"></p>
        </div>

        <div>
            <label for="categoryId">カテゴリ:</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">選択してください</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>
            </select>
            <p th:if="${#fields.hasErrors('categoryId')}"
               th:errors="*{categoryId}"
               style="color: red;"></p>
        </div>

        <button type="submit">更新</button>
    </form>
</body>
</html>
