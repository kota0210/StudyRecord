<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ホーム</title>
</head>
<body>
    <h1>ホーム画面</h1>

    <p>
        ログイン中のユーザー：
        <span th:text="${email}"></span>
    </p>

    <p>ログインに成功しました。</p>

    <hr>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">ログアウト</button>
    </form>
</body>
</html>
